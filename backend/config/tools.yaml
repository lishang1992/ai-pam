# AI 堡垒机 V1 —— AI 可用工具白名单（Tool Registry）
#
# 说明：AI 永远不能直接执行 shell，只能调用这里声明的工具。
# 每个工具的 command_template 是「参数校验通过后」在目标机上执行的固定模板，
# 参数由后端做白名单正则校验后再做插值，从根本上杜绝命令拼接注入。

tools:
  - name: get_system_info
    title: 系统基础信息
    description: 查看主机名、操作系统、内核版本、运行时长、CPU 核数与整体负载
    category: read
    risk_hint: LOW
    params: {}
    command_template: "uptime && head -3 /etc/os-release && uname -r && nproc"

  - name: get_cpu_usage
    title: CPU 使用率
    description: 查看整体 CPU 使用率、负载以及占用最高的进程
    category: read
    risk_hint: LOW
    params: {}
    # 用 vmstat 的第二个采样点，避免 top -bn1 在空闲机器上取到开机至今的均值
    command_template: "uptime && vmstat 1 2 | tail -1 && ps -eo pid,user,%cpu,%mem,cmd --sort=-%cpu | head -6"

  - name: get_memory_usage
    title: 内存使用率
    description: 查看内存与 Swap 使用情况
    category: read
    risk_hint: LOW
    params: {}
    command_template: "free -m"

  - name: get_process_list
    title: 进程列表
    description: 查看占用 CPU 最高的进程，可按关键字过滤
    category: read
    risk_hint: LOW
    params:
      top_n: {type: integer, default: 10, description: 返回条数}
      filter: {type: string, default: "", description: 进程名关键字}
    command_template: "ps -eo pid,ppid,user,%cpu,%mem,stat,etime,cmd --sort=-%cpu | head -n {top_n}"

  - name: get_disk_usage
    title: 磁盘使用率
    description: 查看指定路径的磁盘空间
    category: read
    risk_hint: LOW
    params:
      path: {type: string, default: "/", description: 路径}
    command_template: "df -h {path}"

  - name: get_network_status
    title: 网络连接状态
    description: 查看 TCP 连接统计与监听端口
    category: read
    risk_hint: LOW
    params: {}
    command_template: "ss -s && ss -lntp | head -20"

  - name: get_service_status
    title: 服务状态
    description: 查询 systemd 服务运行状态、启动时间与重启次数
    category: read
    risk_hint: LOW
    params:
      service: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]+$", description: 服务名}
    command_template: "systemctl status {service} --no-pager | head -20"

  - name: get_service_logs
    title: 服务日志
    description: 查看服务最近的应用日志
    category: read
    risk_hint: LOW
    params:
      service: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]+$", description: 服务名}
      lines: {type: integer, default: 50, description: 日志行数}
    command_template: "journalctl -u {service} -n {lines} --no-pager"

  - name: get_database_status
    title: 数据库连接状态
    description: 查看数据库连接数、连接池使用率、慢查询数量
    category: read
    risk_hint: LOW
    params:
      service: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]+$", description: 关联服务名}
    command_template: "mysqladmin extended-status | grep -E 'Threads_connected|Max_used_connections'"

  - name: search_service_logs
    title: 检索服务日志
    description: 在服务日志中按关键字检索，快速定位具体报错
    category: read
    risk_hint: LOW
    params:
      service: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]+$", description: 服务名}
      keyword: {type: string, required: true, pattern: '^[\w .:@/-]{1,40}$', description: 关键字（支持中英文）}
      lines: {type: integer, default: 500, description: 检索范围行数}
    command_template: 'journalctl -u {service} -n {lines} --no-pager | grep -i -E -- "{keyword}" | tail -50'

  - name: tail_log_file
    title: 查看日志文件
    description: 查看指定日志文件的末尾内容
    category: read
    risk_hint: LOW
    params:
      path: {type: string, required: true, pattern: "^/[A-Za-z0-9_./-]+$", description: 日志文件绝对路径}
      lines: {type: integer, default: 100, description: 行数}
    command_template: "tail -n {lines} {path}"

  - name: get_port_status
    title: 检查端口监听
    description: 检查某个端口是否正在监听，以及被哪个进程占用
    category: read
    risk_hint: LOW
    params:
      port: {type: integer, required: true, description: 端口号}
    command_template: 'ss -lntp | grep -E ":{port}\b" || echo "port {port} is NOT listening"'

  - name: get_top_memory_processes
    title: 内存占用 Top 进程
    description: 按内存占用排序查看进程，用于排查内存问题
    category: read
    risk_hint: LOW
    params:
      top_n: {type: integer, default: 10, description: 返回条数}
    command_template: "ps -eo pid,user,%mem,%cpu,rss,cmd --sort=-%mem | head -n {top_n}"

  - name: get_file_info
    title: 查看文件信息
    description: 查看文件或目录的权限、属主与占用空间
    category: read
    risk_hint: LOW
    params:
      path: {type: string, required: true, pattern: "^/[A-Za-z0-9_./-]+$", description: 路径}
    command_template: "ls -ld {path} && du -sh {path}"

  - name: restart_service
    title: 重启服务
    description: 以 systemctl restart 方式重启一个服务（生产环境高危）
    category: write
    risk_hint: HIGH
    params:
      service: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]+$", description: 服务名}
    command_template: "systemctl restart {service}"

  - name: start_service
    title: 启动服务
    description: 启动一个已停止的服务
    category: write
    risk_hint: MEDIUM
    params:
      service: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]+$", description: 服务名}
    command_template: "systemctl start {service}"

  - name: stop_service
    title: 停止服务
    description: 停止一个服务（会造成业务中断）
    category: destructive
    risk_hint: HIGH
    params:
      service: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]+$", description: 服务名}
    command_template: "systemctl stop {service}"

  - name: modify_config
    title: 修改配置文件
    description: 修改服务配置文件，自动保留备份
    category: write
    risk_hint: HIGH
    params:
      path: {type: string, required: true, pattern: "^/[A-Za-z0-9_./-]+$", description: 配置文件绝对路径}
      content: {type: string, required: true, description: 新的配置内容}
    # 内容用 base64 传输，避免任何引号/换行导致的命令注入
    command_template: "cp {path} {path}.bak && printf '%s' '{content_b64}' | base64 -d > {path}"

  - name: install_package
    title: 安装软件包
    description: 通过包管理器安装普通软件包
    category: write
    risk_hint: MEDIUM
    params:
      package: {type: string, required: true, pattern: "^[A-Za-z0-9_.+-]+$", description: 包名}
    command_template: "(command -v dnf >/dev/null && dnf install -y {package}) || apt-get install -y {package}"

  - name: delete_file
    title: 删除文件
    description: 删除目标机上的文件（破坏性操作）
    category: destructive
    risk_hint: CRITICAL
    params:
      path: {type: string, required: true, pattern: "^/[A-Za-z0-9_./*-]+$", description: 文件绝对路径}
    command_template: "rm -f {path}"

  - name: export_database
    title: 导出数据库
    description: 导出数据库到文件（生产数据批量导出，默认禁止）
    category: data
    risk_hint: CRITICAL
    params:
      database: {type: string, required: true, pattern: "^[A-Za-z0-9_]+$", description: 数据库名}
      target: {type: string, required: true, pattern: "^/[A-Za-z0-9_./-]+$", description: 导出文件路径}
    command_template: "mysqldump {database} > {target}"
